<section class="new-wallet">
    <h2 class="section-heading">Add a new wallet</h2>
    <form [formGroup]="new_wallet_form" (submit)="newWallet()">
        <label for="wallet-name">Wallet Name</label>
        <input id="wallet-name" type="text" formControlName="wallet_name" />
        <label for="wallet-seed">Wallet seed</label>
        <input id="wallet-seed" type="text" formControlName="wallet_seed" (change)="generateAddress($event)" />
        <label for="wallet-address">Wallet address</label>
        <input id="wallet-address" type="text" formControlName="wallet_address" />
        
        <button type="submit" class="primary">Add wallet</button>
    </form>
</section>
