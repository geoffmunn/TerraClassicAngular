<section class="wallet-password">
    <h2 class="section-heading">Wallet password</h2>
    <form [formGroup]="walletPassword" (submit)="decryptWallet()">
        <label for="wallet-password">Wallet Password</label>
        <input id="wallet-password" type="password" formControlName="walletPassword" />
        <button type="submit" class="primary">Decrypt wallet</button>
    </form>
</section>
