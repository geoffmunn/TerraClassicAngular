<div class="modal-header">
    <h4 class="modal-title" id="modal-title">Wallet password</h4>
    <button
        type="button"
        class="btn-close"
        aria-label="Close button"
        aria-describedby="modal-title"
        (click)="modal.dismiss('Cross click')"
    ></button>
</div>
<form [formGroup]="walletPassword">
    <div class="modal-body">

    <label for="wallet-password">Wallet Password</label>
    <input id="wallet-password" type="password" formControlName="walletPassword" autocomplete="" />

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="modal.dismiss('cancel click')">Cancel</button>
        <button type="submit" ngbAutofocus class="btn btn-danger" (click)="modal.close('Ok click')">Ok</button>
    </div>
</form>
